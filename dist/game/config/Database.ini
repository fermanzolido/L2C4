# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# Specify the JDBC driver class for your database.
# Default: com.mysql.cj.jdbc.Driver
Driver = com.mysql.cj.jdbc.Driver

# Database URL
# Default: jdbc:mysql://localhost/l2jmobiusc4?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&interactiveClient=true&sessionVariables=wait_timeout=600,interactive_timeout=600&autoReconnect=true
URL = jdbc:mysql://localhost/l2jmobiusc4?useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&interactiveClient=true&sessionVariables=wait_timeout=600,interactive_timeout=600&autoReconnect=true

# Database user info. Default is "root" but it's not recommended.
Login = root

# Database user password, leave empty for no password.
Password = 

# Maximum number of database connections to maintain in the pool.
# HikariCP mantiene una decima parte de este numero abierta de forma
# permanente y puede crecer hasta el numero entero. Estaba en 500, contra un
# max_connections de MariaDB de 151: al crecer el pool la base habria empezado
# a rechazar conexiones. Ademas, mas conexiones que nucleos no da mas trabajo
# hecho por segundo, solo mas hilos peleandose por los mismos 8 nucleos.
# La cuenta que recomienda HikariCP es nucleos * 2 + discos = 8 * 2 + 1 = 17.
# 32 deja el doble de margen y sigue siendo una fraccion del limite de la base.
# Default: 10
MaximumDatabaseConnections = 32

# Determine whether database connections should be tested for availability.
# Default: False
TestDatabaseConnections = False


# ---------------------------------------------------------------------------
# Automatic Database Backup Settings
# ---------------------------------------------------------------------------
# Generate database backups when server restarts or shuts down. 
BackupDatabase = False

# Path to MySQL bin folder. Only necessary on Windows.
MySqlBinLocation = C:/xampp/mysql/bin/

# Path where MySQL backups are stored.
BackupPath = ../backup/

# Maximum number of days that backups will be kept.
# Old files in backup folder will be deleted.
# Set to 0 to disable.
BackupDays = 30
