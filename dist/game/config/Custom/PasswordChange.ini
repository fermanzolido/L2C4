# ---------------------------------------------------------------------------
# Password Change
# ---------------------------------------------------------------------------

# Enables .changepassword voiced command which allows the players to change their account's password ingame.
# Usage in game: .changepassword <current password> <new password> <new password again>
# The game server never sees the stored password. It forwards the request to the login server,
# which checks the current password and stores the new one, and answers the character that asked.
# Default: False
AllowChangePassword = False

# Shortest new password accepted. The command also refuses a password longer than 16 characters,
# because the client's own account field stops there and a longer one could be stored and then
# never be typeable at the login screen.
# Default: 4
MinimumPasswordLength = 4
