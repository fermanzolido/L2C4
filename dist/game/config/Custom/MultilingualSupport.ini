# ---------------------------------------------------------------------------
# Multilingual support
# ---------------------------------------------------------------------------

# Enable or disable multilingual support.
# This fork ships it on, because it ships a Spanish pack worth switching to. Turning it off
# costs nothing: every player stays on English and the .lang command stops answering.
# Default: False
MultiLangEnable = True

# Default language, if not defined.
# Default: en
MultiLangDefault = en

# List of allowed languages, semicolon separated.
# Default: en;el
MultiLangAllowed = en;el;es

# Enable or disable voice command .lang for changing languages on the fly.
# Default: True
MultiLangVoiceCommand = True
