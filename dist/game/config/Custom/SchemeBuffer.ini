#=============================================================
#                          Buffer
#=============================================================
# Also check data\SchemeBufferSkills.xml

# Maximum number of available schemes per player.
BufferMaxSchemesPerChar = 4

# Payment for buffer, can be changed to custom server coin.
BufferItemId = 57

# Static cost of buffs ; override skills price if different of -1.
BufferStaticCostPerBuff = -1

# Level up to which the buffer serves everyone, free of charge.
# Above it only accounts with premium status are served, so the buffer stays a
# starting aid rather than a replacement for a real buffer class.
# Set to 0 to require premium from level 1, or to a level above the cap to keep it
# free for everyone.
# Default: 30
BufferFreeUntilLevel = 30

# Duration in seconds of the buffs this npc gives, overriding the skill's own.
# Leave at -1 unless the npc's buffs should differ from the same skill cast by a
# player: the hour these buffs last is set once for everyone in Player.ini, under
# SkillDurationList, so that a real Prophet or Sword Muse is never the worse option.
# Default: -1
BufferBuffTime = -1
