<html><body>Magister Juris:<br>
Que la quietud de los lagos serenos te acompane. Soy el Magister Juris y enseno magia a los Elfos.<br>
Me gustaria compartir mi conocimiento con vos, pero por desgracia solo los misticos elfos pueden entender mis ensenanzas. Seguro hay alguien que puede ensenarte, si seguis buscando.
