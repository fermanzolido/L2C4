<html><body>Rey Liche Icarus:<br>
Bua ja ja! Debes estar demente, igual que el viejo Hardin!<br>
Que pensas que puedo ensenarte? Aunque ahora estoy muerto, en mi vida anterior adquiri habilidades misticas humanas! Asi que solo puedo ensenarle a misticos humanos! Por que no vas a buscar un maestro que te vaya mejor?
