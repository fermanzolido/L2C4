<html><title>Menu de Spawn</title><body>
<center>
<table width=270><tr>
<td width=45><button value="Inicio" action="bypass admin_admin" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=180><center><button value="Spawnear NPCs" action="bypass admin_show_npcs" width=95 height=21 back="bigbutton_over" fore="bigbutton"></center></td>
<td width=45><button value="Volver" action="bypass admin_spawn" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
</tr></table><br>
Spawnear NPC/Mob por ID:<font color="LEVEL"> [*]</font><br1>
<table width=270><tr>
<td width=90>ID|nombre/cant.:</td>
<td width=60><edit var="id" width=60 height=15></td>
<td width=15><edit var="qty" width=15 height=15></td>
<td width=45><button value="Spawn" action="bypass -h admin_spawn_monster $id $qty" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=45><button value="Spawn 1" action="bypass -h admin_spawn_once $id $qty" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
</tr></table><br>
Especial:<br1>
<table width=270>
<tr>
	<td><button value="Recargar" action="bypass -h admin_spawn_reload" width=95 height=21 back="bigbutton_over" fore="bigbutton"></td>
	<td><button value="Despawnear Todo" action="bypass -h admin_unspawnall" width=95 height=21 back="bigbutton_over" fore="bigbutton"></td>
	<td><button value="Respawnear Todo" action="bypass -h admin_respawnall" width=95 height=21 back="bigbutton_over" fore="bigbutton"></td>
</tr>
<tr>
<td><button value="Spawn Noche" action="bypass -h admin_spawnnight" width=95 height=21 back="bigbutton_over" fore="bigbutton"></td>
<td><button value="Spawn Dia" action="bypass -h admin_spawnday" width=95 height=21 back="bigbutton_over" fore="bigbutton"></td>
<td></td>
</tr>
</table>
</center><br>
[*]: Los nombres no distinguen mayus/minus, pero tenes que usar guion bajo en vez de espacios.<br>
Podes dejar vacio el campo de cantidad si no necesitas mas de un mob.
</body></html>
