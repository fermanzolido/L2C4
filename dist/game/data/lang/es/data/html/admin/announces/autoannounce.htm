<html><body>
<table width=270><tr>
<td width=45><button value="Inicio" action="bypass admin_admin" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=180><center>Menu de Autoanuncios</center></td>
<td width=45><button value="Volver" action="bypass admin_admin7" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
</tr></table><br><br>
<center>Nuevo autoanuncio:</center><br>
<table width=270><tr>
<td>Retraso inicial en seg:</td>
<td><edit var="autoann_initial" width=50></td>
</tr><tr>
<td>Retraso entre anuncios en seg:</td>
<td><edit var="autoann_delay" width=50></td>
</tr><tr>
<td>Repetir (-1 para infinito):</td>
<td><edit var="autoann_repeat" width=50></td>
</tr><tr>
<td>Critico:</td>
<td><combobox var="autoann_critical" list="false;true" width=50></td>
</tr><tr>
<td>Texto:</td></tr></table>
<multiedit var="autoann_memo" width=250 height=50><br>
<center><table><tr>
<td><button value="Agregar" action="bypass admin_add_autoann $autoann_initial $autoann_delay $autoann_repeat $autoann_critical $autoann_memo" width=65 height=21 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
<td><button value="Recargar" action="bypass admin_reload_autoann" width=65 height=21 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
</tr></table></center>
<br>
%announces%
</body></html>
