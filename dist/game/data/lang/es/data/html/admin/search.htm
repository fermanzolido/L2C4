<html><title>Busqueda de Items (Admin)</title><body>
<center>
<table width=270>
<tr>
<td width=45><button value="Inicio" action="bypass admin_admin" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=180><center>Encantar</center></td>
<td width=45><button value="Volver" action="bypass admin_admin" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
</tr>
</table>
	<br>
	<table width=285 height=15 border=0>
		<tr>
			<td width="30" align="center">Buscar:</td>
			<td width="130" align="center"><edit var="word" width=140 height=12></td>
			<td width="50" align="center"><button value="Buscar" action="bypass admin_search $word" width=65 height=21 back="L2UI_ch3.smallbutton2_over" fore="L2UI_ch3.smallbutton2"></td>
		</tr>
	</table>
	<br>
	<table width=285 height=23 border=0 bgcolor=444444>
		<tr>
			<td width="25" align="center">Id:</td>
			<td width="40" align="center"><edit var="itemId" width=50 height=12></td>
			<td width="25" align="center">Cant.:</td>
			<td width="40" align="center"><edit var="qty" width=50 height=12></td>
			<td width="50" align="center"><button value="Yo" action="bypass admin_create_item $itemId $qty" width=40 height=15 back="sek.cbui94" fore="sek.cbui94"></td>
			<td width="50" align="center"><button value="Objetivo" action="bypass admin_give_item_target $itemId $qty" width=40 height=15 back="sek.cbui94" fore="sek.cbui94"></td>
		</tr>
	</table>
	<table width=285 border=0>
		%items%
	</table>
	<table width=279 bgcolor=444444>
		<tr><td width=270>Pagina: %pages%</td></tr>
	</table>
</body></html>
