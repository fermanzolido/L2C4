<html><title>Puntos de Juego (Admin)</title><body>
<center>
<table width=270>
<tr>
<td width=45><button value="Inicio" action="bypass admin_admin" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=180><center>Menu de Puntos de Juego (Admin)</center></td>
<td width=45></td>
</tr>
</table>
<br>
Cada comando de abajo actua sobre el <font color="LEVEL">jugador seleccionado actualmente</font>.<br>
<br>
<table width=270>
<tr>
<td>Cantidad:</td>
<td><edit var="points" width=100 height=15 type=number></td>
</tr>
</table>
<br>
<table width=270>
<tr>
<td><button value="Agregar" action="bypass -h admin_add_game_points $points" width="85" height="21" back="bigbutton_over" fore="bigbutton"></td>
<td><button value="Restar" action="bypass -h admin_subtract_game_points $points" width="85" height="21" back="bigbutton_over" fore="bigbutton"></td>
<td><button value="Fijar" action="bypass -h admin_set_game_points $points" width="85" height="21" back="bigbutton_over" fore="bigbutton"></td>
</tr>
</table>
<br>
<table width=270>
<tr>
<td><button value="Ver total actual" action="bypass -h admin_count_game_points" width="180" height="21" back="bigbutton_over" fore="bigbutton"></td>
</tr>
</table>
<br>
</center>
</body></html>
