<html><body>
Las instalaciones especiales del clan hall estan activas.<br>
Cada una de las siguientes instalaciones debe activarse desde el menu &nbsp;<a action="bypass -h npc_%objectId%_manage">Administrar Clan Hall </a>&nbsp; antes de usarla.<br>
<center><br>
<font color="LEVEL">Recuperacion de Hp:</font> <font color="00FFFF">%hp_regen%</font>%<br>
<font color="LEVEL">Recuperacion de Mp:</font> <font color="00FFFF">%mp_regen%</font>%<br>
<font color="LEVEL">Recuperacion de Exp. al Resucitar:</font> <font color="00FFFF">%xp_regen%</font>%<br>
<button value="Portal" action="bypass -h npc_%objectId%_functions tele" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"><br>
<button value="Magia" action="bypass -h npc_%objectId%_functions support" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"><br>
<button value="Crear Item" action="bypass -h npc_%objectId%_functions item_creation %npcId%" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal"><br>
<button value="Inicio" action="bypass -h npc_%objectId%_list_back" width=75 height=21 back="L2UI_ch3.Btn1_normalOn" fore="L2UI_ch3.Btn1_normal">
</center>
</body></html>
