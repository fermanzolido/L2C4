<html><body>Boletin del gremio:<br>
Al contrario de lo que dice su fama, Allector pelea contra un solo rival por vez. Si no se respeta esa regla, abandona el combate aunque lleve ventaja.<br>
Su arma predilecta, una bola de fuego explosiva, es formidable! Si te lo cruzas, vas a tener que ocuparte primero de eso!</body></html>
