<html><body>Libro viejo:<br>
Naverius: oficial de alto rango, muy querido por Tanakia, el angel caido. Naverius es un maestro de las maldiciones. Aporto muchisimo a ganar la guerra. Si tenes que pelear contra el, tenes que zafar rapido de su poder. Sus maldiciones se superan usando Guidance, Shield y Might.
