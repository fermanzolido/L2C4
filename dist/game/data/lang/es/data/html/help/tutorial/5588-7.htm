<font color="LEVEL">Ponerse y sacarse el equipo</font><br>
Para ponerte una pieza de equipo, abri la ventana de inventario (Tab o Alt+V) y haz doble clic en lo que te quieras poner. Al hacer doble clic sobre algo que ya tenes puesto, te lo sacas.<br>
