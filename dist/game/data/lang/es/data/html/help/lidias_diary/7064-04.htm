<html><body>Diario de Lidia:<br>
Vigesimo segundo dia del mes de Shilen.<br><br>
Escuche sin querer a mi padre mientras le servia el te al invitado.<br>
Hablaba y hablaba de empezar una revolucion!
En que esta pensando?<br>
Perdimos demasiado en la ultima guerra, hasta el unico hermano de la pobre Rose!<br>
