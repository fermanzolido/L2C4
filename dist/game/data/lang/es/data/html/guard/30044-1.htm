<html><body>Guardia Chiperan:<br>
Deja la montana a tu izquierda y camina hasta llegar a un rio chico. Si seguis el rio contra la corriente, llegas a las cascadas, que son su nacimiento.<br>
Ahi aparecen orcos seguido, asi que es medio peligroso, pero el espectaculo magnifico de la cascada vale el riesgo.
</body></html>
