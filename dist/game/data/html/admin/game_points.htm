<html><title>Admin Game Points</title><body>
<center>
<table width=270>
<tr>
<td width=45><button value="Main" action="bypass admin_admin" width=45 height=15 back="sek.cbui94" fore="sek.cbui92"></td>
<td width=180><center>Admin Game Points Menu</center></td>
<td width=45></td>
</tr>
</table>
<br>
Every command below acts on the <font color="LEVEL">currently selected player</font>.<br>
<br>
<table width=270>
<tr>
<td>Amount:</td>
<td><edit var="points" width=100 height=15 type=number></td>
</tr>
</table>
<br>
<table width=270>
<tr>
<td><button value="Add" action="bypass -h admin_add_game_points $points" width="85" height="21" back="bigbutton_over" fore="bigbutton"></td>
<td><button value="Subtract" action="bypass -h admin_subtract_game_points $points" width="85" height="21" back="bigbutton_over" fore="bigbutton"></td>
<td><button value="Set" action="bypass -h admin_set_game_points $points" width="85" height="21" back="bigbutton_over" fore="bigbutton"></td>
</tr>
</table>
<br>
<table width=270>
<tr>
<td><button value="Show current total" action="bypass -h admin_count_game_points" width="180" height="21" back="bigbutton_over" fore="bigbutton"></td>
</tr>
</table>
<br>
</center>
</body></html>
