-server -Dfile.encoding=UTF-8 -Djava.util.logging.manager=org.l2jmobius.log.ServerLogManager -Dorg.slf4j.simpleLogger.log.com.zaxxer.hikari=warn -XX:+UseZGC -Xms8g -Xmx8g -XX:SoftMaxHeapSize=6g -XX:+AlwaysPreTouch -XX:+UseStringDeduplication -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=log -Xlog:gc*:file=log/gc.log:time,uptime,level,tags:filecount=5,filesize=20m